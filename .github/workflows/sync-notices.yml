name: Sync PNU Notices

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: sync-pnu-notices
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Scrape and synchronize recent notices
        run: npm run seed:notices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Notices are published into the knowledge base as they arrive, which
          # needs an embedding key. Without this secret the sync still stores
          # every notice and the Notices screen is unaffected — the documents
          # are simply written unembedded, and the next run that does have a key
          # picks them up. Retrieval cannot see them until then.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
