name: PR CI

on:
  pull_request:
  # Also run on main after a merge. Twice now (#24, #27) a merge resolution has
  # interleaved two versions of a file without producing conflict markers, so
  # git reported a clean merge while leaving code that does not compile. Because
  # this workflow only listened to pull_request, nothing rechecked main
  # afterwards and the breakage sat undetected for hours.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_KEY: ci-only-test-key
      JWT_SECRET: ci-only-test-secret-64-characters-long-for-import-validation-000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test -- --runInBand
        working-directory: backend
      - run: npm run test:pnu-course-rollback:integration
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test:course-offerings
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
