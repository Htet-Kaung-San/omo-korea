# Render Blueprint — one API service and one static site.
#
# The point of hosting this is that the API keys live on the server and nobody
# needs a copy. Every secret below is `sync: false`, which means Render asks for
# it once in the dashboard and it is never written to this file or to git.
#
# There are no VITE_SUPABASE_* variables here, and there is no longer any code
# that would read them: the browser talks to Postgres only through this API.
# Setting them in the dashboard would have no effect. That matters because Vite
# inlines every VITE_ variable into the JavaScript it ships, and only
# student_timetable and the course tables have row level security — a database
# key in the bundle would let any logged-in student read and write the rest.
#
# See DEPLOY.md for what to paste where.

services:
  - type: web
    name: heypnu-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/students/courses
    envVars:
      - key: NODE_ENV
        value: production

      # Where the browser app is served from. Must be the exact origin —
      # scheme and host, no trailing slash — because index.js compares
      # req.headers.origin against this list literally.
      - key: CORS_ORIGINS
        sync: false
      # Used to build password-reset links, so it must match the site origin.
      - key: APP_BASE_URL
        sync: false

      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true

      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      - key: GEMINI_API_KEY
        sync: false

      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false

  - type: web
    name: heypnu-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Must end in /api and carry no trailing slash — the client appends
      # paths like /students/feedback directly onto it.
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_NAVER_MAP_CLIENT_ID
        sync: false
    headers:
      # Render's static host has no MIME mapping for .webmanifest and served it
      # as binary/octet-stream, which iOS rejects — and on iPhone the manifest
      # is what allows Add to Home Screen, which is the only way Safari
      # delivers web push at all. The file is manifest.json for that reason;
      # this states the type explicitly regardless.
      - path: /manifest.json
        name: Content-Type
        value: application/manifest+json
      # The worker must be allowed to control the whole origin, not just /.
      - path: /sw.js
        name: Service-Worker-Allowed
        value: /
    routes:
      # Single-page app: every path has to serve index.html or a hard refresh
      # on /ai or /support/work-permit returns 404 from the static host.
      #
      # Listed after the service worker and manifest so the catch-all cannot
      # swallow them — a rewrite that returned index.html for /sw.js would
      # register HTML as a service worker and push would fail with a MIME
      # error that points nowhere near the cause.
      - type: rewrite
        source: /*
        destination: /index.html
